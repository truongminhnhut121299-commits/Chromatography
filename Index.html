<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromatography</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    overflow: hidden;
}

/* Background glow effect */
body::before {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(0,255,255,0.3), transparent 70%);
    animation: moveGlow 10s infinite alternate ease-in-out;
}

@keyframes moveGlow {
    from { transform: translate(-100px, -100px); }
    to { transform: translate(100px, 100px); }
}

/* Main container */
.container {
    text-align: center;
    padding: 50px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.05);
    box-shadow: 0 0 30px rgba(0,0,0,0.4);
}

/* Chromatography text */
.title {
    font-size: 64px;
    font-weight: 600;
    color: #00ffff;
    letter-spacing: 3px;
    text-shadow: 0 0 15px rgba(0,255,255,0.8);
    animation: fadeIn 2s ease;
}

.subtitle {
    margin-top: 10px;
    font-weight: 300;
    color: #ffffffaa;
    font-size: 18px;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>
</head>

<body>

<div class="container">
    <div class="title">Chromatography</div>
    <div class="subtitle">Science • Separation • Precision</div>
</div>

</body>
</html>
